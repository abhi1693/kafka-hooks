name: Publish Image
on:
  release:
    types:
      - published
env:
  REGISTRY: ghcr.io
jobs:
  tests:
    uses: abhi1693/actions/.github/workflows/python-uv-tests.yml@34e92ba1eee6a47e9b10f13e2180114fc01b6027
    with:
      python-version: '3.12'
      sync-command: uv sync --locked --extra dev
  publish:
    needs: tests
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@98222de88f6768904e43a1a92a32e2bdc9a16e4c
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/${{ github.repository }}
      file: Dockerfile
      runs-on: ubuntu-24.04
      platforms: linux/amd64
      cache-scope: kafka-hooks
      tags: |-
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
