name: Publish Image
on:
  release:
    types:
      - published
env:
  REGISTRY: ghcr.io
jobs:
  tests:
    uses: abhi1693/actions/.github/workflows/python-ci.yml@v1
    with:
      python-version: '3.12'
      sync-command: uv sync --locked --extra dev
  publish:
    needs: tests
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      push: true
      matrix: '[{"runner":"ubuntu-24.04","platform":"linux/amd64"}]'
      image: ghcr.io/${{ github.repository }}
      file: Dockerfile
      cache-scope: kafka-hooks
      tags: |-
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
